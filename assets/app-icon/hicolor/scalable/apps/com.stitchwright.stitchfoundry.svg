<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>StitchFoundry</title>
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <!-- satin: slanted thread lines across the stroke -->
    <pattern id="satin" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <rect width="15" height="15" fill="#f2546b"/>
      <rect width="5" height="15" fill="#ff8c9b"/>
      <rect x="13" width="2" height="15" fill="#d63d55"/>
    </pattern>
  </defs>
  <g clip-path="url(#tile)">
    <!-- field -->
    <rect width="512" height="512" fill="#1e2b4f"/>
    <!-- machine hoop: the bracket that clips onto the embroidery arm, the frame, the fabric -->
    <rect x="18" y="262" width="62" height="104" rx="14" fill="#c7cedb"/>
    <circle cx="40" cy="290" r="7" fill="#1e2b4f"/>
    <circle cx="40" cy="338" r="7" fill="#1e2b4f"/>
    <rect x="58" y="172" width="396" height="290" rx="46" fill="#f6f1e7" stroke="#e4e8ef" stroke-width="24"/>
    <rect x="72" y="186" width="368" height="262" rx="34" fill="none" stroke="#b3bccb" stroke-width="5"/>
    <!-- the satin S being sewn, with a shadow -->
    <path d="M 346 256 C 330 218, 222 214, 214 262 C 206 308, 330 300, 326 360 C 322 414, 214 424, 180 392"
          fill="none" stroke="#b8344b" stroke-width="66" stroke-linecap="round" transform="translate(0 5)"/>
    <path d="M 346 256 C 330 218, 222 214, 214 262 C 206 308, 330 300, 326 360 C 322 414, 214 424, 180 392"
          fill="none" stroke="url(#satin)" stroke-width="60" stroke-linecap="round"/>
    <!-- machine head over the hoop: presser bar and foot, needle bar, clamp, needle -->
    <rect x="286" y="-60" width="260" height="168" rx="40" fill="#e4e8ef"/>
    <rect x="286" y="88" width="260" height="20" fill="#c7cedb"/>
    <rect x="368" y="104" width="12" height="140" rx="4" fill="#aab3c3"/>
    <ellipse cx="350" cy="246" rx="26" ry="8" fill="none" stroke="#8d97aa" stroke-width="6"/>
    <rect x="341" y="104" width="18" height="78" rx="3" fill="#b7bfcd"/>
    <rect x="334" y="178" width="32" height="18" rx="4" fill="#8a94a8"/>
    <path d="M 345 196 L 355 196 L 350 258 Z" fill="#eef1f6" stroke="#8d97aa" stroke-width="2" stroke-linejoin="round"/>
    <!-- the top thread running down into the needle -->
    <path d="M 312 108 C 312 150, 330 168, 346 200" fill="none" stroke="#f2546b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
